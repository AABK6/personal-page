<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../../scpo/shared/design-system.css">
  <link rel="stylesheet" href="../../scpo/shared/styles.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white p-8">
  
  <div id="non-rivalrous-container" class="max-w-4xl mx-auto">
    <div class="visualizer-grid grid md:grid-cols-2 gap-12">
      <!-- Rival Good -->
      <div id="rival-good" class="good-card bg-slate-900 rounded-2xl p-8 border border-slate-800 text-center cursor-pointer">
        <h3 class="text-xl font-bold mb-4">Rival Good (Apple)</h3>
        <div class="apple-container h-32 flex items-center justify-center text-6xl">🍎</div>
        <p class="mt-4 text-slate-400">Click to consume</p>
      </div>
      
      <!-- Non-Rival Good -->
      <div id="non-rival-good" class="good-card bg-slate-900 rounded-2xl p-8 border border-slate-800 text-center cursor-pointer">
        <h3 class="text-xl font-bold mb-4">Non-Rival Good (Code)</h3>
        <div class="code-container h-32 flex items-center justify-center font-mono text-cyan-400 text-2xl overflow-hidden">
          <code>print("Hello")</code>
        </div>
        <p class="mt-4 text-slate-400">Click to share</p>
      </div>
    </div>
  </div>

  <script src="../../scpo/js/non-rivalrous.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof window.initNonRivalrousVisualizer === 'function') {
        window.initNonRivalrousVisualizer();
      }
    });
  </script>
</body>
</html>
