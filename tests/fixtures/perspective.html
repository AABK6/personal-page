<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../../scpo/shared/design-system.css">
  <link rel="stylesheet" href="../../scpo/shared/styles.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white p-8">
  <div class="perspective-section" data-perspectives="washington,brazil">
    
    <!-- The container where the UI toggle will be injected -->
    <div class="perspective-controls mb-8"></div>
    
    <div class="content transition-colors duration-500 rounded-lg p-6">
      <p>The NetMundial summit was a turning point.</p>
      
      <p class="perspective-content washington hidden">
        <span class="bg-blue-900/50 p-2 rounded">From Washington's view: we must maintain the multi-stakeholder model to prevent authoritarian control.</span>
      </p>
      
      <p class="perspective-content brazil hidden">
        <span class="bg-green-900/50 p-2 rounded">From Brazil's view: the NSA spying shows we need digital sovereignty and a more democratic internet governance.</span>
      </p>
    </div>
  </div>

  <script src="../../scpo/js/perspective.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof window.initPerspectiveSwitchers === 'function') {
        window.initPerspectiveSwitchers();
      }
    });
  </script>
</body>
</html>
